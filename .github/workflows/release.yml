name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  docs:
    uses: ./.github/workflows/docs.yml
  draft:
    name: Draft verified release
    needs: [ci, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: distributions
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" distributions/* \
            --verify-tag --draft --title "WaveBench $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
