name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install package and test dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev --extra analysis --extra pdf

      - name: Run Ruff
        run: uv run --no-sync python -m ruff check .

      - name: Audit documentation
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python .agents/skills/wavebench-docs/scripts/audit_docs.py --quiet-warnings

      - name: Check generated Reference
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python scripts/generate_docs.py --check

      - name: Report documentation impact
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python scripts/docs_impact.py

      - name: Run unit tests
        run: uv run --no-sync python -m pytest -q

  test-windows:
    name: Windows Python ${{ matrix.python-version }} tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install package and Windows test dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev --extra analysis --extra tui

      - name: Check dependencies
        run: uv pip check --python .venv

      - name: Run Ruff
        run: uv run --no-sync python -m ruff check .

      - name: Run unit tests
        run: uv run --no-sync python -m pytest -q

      - name: Run offline CLI smoke tests
        shell: pwsh
        run: |
          uv run --no-sync python -m wavebench --help
          uv run --no-sync python -m wavebench run schema | Out-Null
          uv run --no-sync python -m wavebench run template --list
          uv run --no-sync python -m wavebench lock status TCPIP::192.0.2.10::INSTR
