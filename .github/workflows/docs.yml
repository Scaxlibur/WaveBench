name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - ".agents/skills/wavebench-docs/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "plans/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/docs_impact.py"
      - "scripts/generate_docs.py"
      - "src/wavebench/**"
      - "wavebench.example.toml"
  pull_request:
    paths:
      - ".agents/skills/wavebench-docs/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "plans/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/docs_impact.py"
      - "scripts/generate_docs.py"
      - "src/wavebench/**"
      - "wavebench.example.toml"
  workflow_dispatch:

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra docs

      - name: Check generated Reference
        run: uv run --no-sync python scripts/generate_docs.py --check

      - name: Audit documentation
        run: uv run --no-sync python .agents/skills/wavebench-docs/scripts/audit_docs.py --quiet-warnings

      - name: Build site
        run: uv run --no-sync mkdocs build --strict

      - name: Report documentation impact
        run: uv run --no-sync python scripts/docs_impact.py
