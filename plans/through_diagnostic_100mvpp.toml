# 短时实机诊断：验证直通接线和 autoscale 后的两通道稳定性。

[experiment]
name = "through_diagnostic_100mvpp"
label = "through_diagnostic_100mvpp"

[restore]
source_state = true
source_channel = 1

[[steps]]
kind = "source.set_func"
channel = 1
function = "sin"

[[steps]]
kind = "source.set_vpp"
channel = 1
value_vpp = 0.1

[[steps]]
kind = "source.set_freq"
channel = 1
frequency_hz = 10000

[[steps]]
kind = "source.output"
channel = 1
state = "on"

[[steps]]
kind = "sweep.frequency_response"
label = "through_diagnostic"
source_channel = 1
reference_channel = 1
response_channel = 2
frequencies_hz = [10000, 100000, 500000]
amplitudes_vpp = [0.1]
autoscale_each_amplitude = true
target_cycles = 10
settle_s = 3.0
points = "def"
save_csv = false
screenshot = false
