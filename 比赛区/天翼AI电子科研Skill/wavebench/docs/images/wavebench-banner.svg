<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1220 200"
  role="img"
  aria-labelledby="title desc"
  shape-rendering="geometricPrecision"
>
  <title id="title">WaveBench</title>
  <desc id="desc">
    Multiple laboratory inputs converge into a measurement bench
    and produce a waveform.
  </desc>

  <style>
    /*
     * Light theme
     */
    .fg-stroke {
      fill: none;
      stroke: #14283D;
    }

    .muted-stroke {
      fill: none;
      stroke: #8B99A6;
    }

    .accent-stroke {
      fill: none;
      stroke: #12BFC6;
    }

    .accent-fill {
      fill: #12BFC6;
    }

    .node {
      fill: #EEF9FA;
      stroke: #12BFC6;
    }

    .wordmark {
      fill: #14283D;
    }

    /*
     * Dark theme
     */
    @media (prefers-color-scheme: dark) {
      .fg-stroke {
        stroke: #E8EEF3;
      }

      .muted-stroke {
        stroke: #75838F;
      }

      .accent-stroke {
        stroke: #20D4DA;
      }

      .accent-fill {
        fill: #20D4DA;
      }

      .node {
        fill: #102A32;
        stroke: #20D4DA;
      }

      .wordmark {
        fill: #E8EEF3;
      }
    }
  </style>


  <!-- =========================================================
       Input symbols
       ========================================================= -->

  <g
    class="fg-stroke"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Circle input -->
    <circle
      cx="48"
      cy="48"
      r="15"
    />

    <!-- Square input -->
    <rect
      x="33"
      y="85"
      width="30"
      height="30"
      rx="3"
    />

    <!-- Triangle input -->
    <path
      d="
        M48 139
        L65 168
        H31
        Z
      "
    />

  </g>


  <!-- =========================================================
       Converging instrument paths
       ========================================================= -->

  <g
    class="muted-stroke"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Top path -->
    <path
      d="
        M63 48
        H101

        Q116 48 124 60

        L145 86

        Q153 96 166 96

        H204
      "
    />

    <!-- Middle path -->
    <path
      d="
        M63 100
        H204
      "
    />

    <!-- Bottom path -->
    <path
      d="
        M65 153
        H101

        Q116 153 125 141

        L145 116

        Q153 105 166 105

        H204
      "
    />

  </g>


  <!-- Highlighted main signal path -->
  <path
    d="
      M91 100
      H204
    "
    class="accent-stroke"
    stroke-width="6"
    stroke-linecap="round"
  />


  <!-- =========================================================
       Bench / orchestration node
       ========================================================= -->

  <rect
    x="204"
    y="64"
    width="88"
    height="72"
    rx="16"
    class="node"
    stroke-width="7"
  />

  <!-- Central bench point -->
  <circle
    cx="248"
    cy="100"
    r="6"
    class="accent-fill"
  />


  <!-- =========================================================
       Output connection
       ========================================================= -->

  <path
    d="
      M292 100
      H326
    "
    class="muted-stroke"
    stroke-width="6"
    stroke-linecap="round"
  />

  <circle
    cx="337"
    cy="100"
    r="5"
    class="accent-fill"
  />


  <!-- =========================================================
       Measurement waveform
       ========================================================= -->

  <path
    d="
      M347 100

      C360 100
       363 80
       376 80

      C392 80
       397 130
       414 130

      C433 130
       440 61
       460 61

      C481 61
       488 141
       509 141

      C530 141
       537 72
       557 72

      C575 72
       581 100
       598 100
    "
    class="accent-stroke"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


